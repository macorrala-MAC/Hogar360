*{box-sizing:border-box}

.meter{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:10px 0 6px}

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const TD=()=>iso(today());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const daysTo=s=>Math.round((parse(s)-today())/864e5);
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const fdate=(s,o)=>parse(s).toLocaleDateString('es-MX',o||{day:'numeric',month:'short'});
const fdateY={day:'numeric',month:'short',year:'numeric'};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const money=n=>{n=Math.round(Number(n)||0)||0;return n.toLocaleString('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:0})};
const num=n=>(Number(n)||0).toLocaleString('es-MX');
const r2=n=>Math.round(n*100)/100;

function rel(s){const d=daysTo(s);if(d===0)return 'Hoy';if(d===1)return 'Mañana';if(d===-1)return 'Ayer';return d>1?'En '+d+' días':'Hace '+(-d)+' días'}
function duePhrase(d){if(d<0)return 'Vencido hace '+(-d)+' d';if(d===0)return 'Vence hoy';if(d===1)return 'Vence mañana';return 'Vence en '+d+' d'}
const dpill=d=>`<span class="pill ${d<0?'bad':d<=30?'warn':'ok'}">${esc(duePhrase(d))}</span>`;
function nextDay(dia){const t=today();dia=Number(dia);if(!dia)return null;let y=t.getFullYear(),m=t.getMonth();for(let i=0;i<2;i++){const last=new Date(y,m+1,0).getDate();const d=new Date(y,m,Math.min(dia,last));if(d>=t)return iso(d);m++;if(m>11){m=0;y++}}return null}
function weekStart(){const t=today();return iso(addDays(t,-((t.getDay()+6)%7)))}

const lsGet=k=>{try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):null}catch(e){return null}};

const BROWSER_DL={save:o=>new Promise((ok,no)=>{try{const d=o.data,isT=typeof d==='string';const b=new Blob([d],{type:/\.pdf$/i.test(o.filename)?'application/pdf':isT?'text/plain;charset=utf-8':'application/octet-stream'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok()}catch(e){no(e)}})};
const W={};
function save(k){
  lsSet(k,S[k]);
  if(!DB)return;
  if(READONLY){toast('Solo lectura: el cambio no se guardó en la nube');return}
  const w=W[k]||(W[k]={t:null,busy:false,dirty:false});
  w.dirty=true;setSync('Guardando…');clearTimeout(w.t);w.t=setTimeout(()=>flush(k),350);
}
async function flush(k){
  const w=W[k];if(w.busy)return;w.busy=true;
  try{while(w.dirty){w.dirty=false;await DB.doc('hogar/'+k).set({items:clone(S[k]),v:Date.now()})}setSync('Guardado')}
  catch(e){setSync('No se pudo guardar');toast('No se pudo guardar en la nube. Intenta de nuevo.')}
  finally{w.busy=false}
}
const seeded={};
function subscribe(k){
  DB.doc('hogar/'+k).onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(snap.exists){const d=snap.data();if(d&&d.items!=null){S[k]=clone(d.items);lsSet(k,S[k]);if(k==='tarjetas')S.tarjetas.forEach(c=>watchMov(c.id));softRender()}}
    else if(!seeded[k]){seeded[k]=true;const loc=lsGet(k);if(hasData(loc)){S[k]=loc;save(k)}}
  },()=>setSync('Sincronización detenida'));
}
const movSub={};
function watchMov(id){const k='mov_'+id;ensureMov(id);if(DB&&!movSub[k]){movSub[k]=1;subscribe(k)}}
function dropMov(id){const k='mov_'+id;delete S[k];try{localStorage.removeItem(LS+k)}catch(e){}if(DB)DB.doc('hogar/'+k).delete().catch(()=>{})}
function loginGate(auth){
  return new Promise(res=>{
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px';
    o.innerHTML='<form style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px"><h1 style="font:700 28px var(--f-disp)">Hogar 360</h1><p style="margin:0;color:var(--muted)">Inicia sesión para ver los datos de tu hogar.</p><input name="e" type="email" autocomplete="username" placeholder="Correo" required><input name="p" type="password" autocomplete="current-password" placeholder="Contraseña" required><div id="lg-err" style="color:var(--bad);font-size:13px;min-height:18px"></div><button class="btn pri" type="submit">Entrar</button></form>';
    document.body.appendChild(o);
    const f=o.querySelector('form'),err=o.querySelector('#lg-err');
    f.onsubmit=async ev=>{
      ev.preventDefault();err.textContent='';
      try{const c=await auth.signInWithEmailAndPassword(f.e.value.trim(),f.p.value);o.remove();res(c.user)}
      catch(e){err.textContent=/network/.test(e.code||'')?'Sin conexión. Intenta de nuevo.':'Correo o contraseña incorrectos.'}
    };
    f.e.focus();
  });
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use){
      DL=BROWSER_DL;
      if(!window.firebase){setSync('Error: no cargó Firebase SDK');return}
      if(!window.HOGAR_FIREBASE||!window.HOGAR_FIREBASE.projectId){setSync('Error: falta firebase-config.js');return}
      firebase.initializeApp(window.HOGAR_FIREBASE);
      const auth=firebase.auth();
      let user=await new Promise(res=>{const off=auth.onAuthStateChanged(u=>{off();res(u)})});
      if(!user)user=await loginGate(auth);
      DB=firebase.firestore();
      KEYS.forEach(subscribe);S.tarjetas.forEach(c=>watchMov(c.id));setSync('Sincronizado');
      return;
    }
    window.claude.use('downloads').then(x=>{DL=x;if(x&&UI.sec==='hogar'&&UI.hogTab==='inventario')render()},()=>{});
    const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!r[0]){setSync('Solo en este dispositivo');return}
    DB=r[0];
    if(r[1]){try{const c=await r[1].can('data.write');if(c===false){READONLY=true;render()}}catch(e){}}
    KEYS.forEach(subscribe);S.tarjetas.forEach(c=>watchMov(c.id));setSync('Sincronizado');
  }catch(e){setSync('Error: '+((e&&(e.code||e.message))||e))}
}
function softRender(){
  const a=document.activeElement;
  if(MODAL.el||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a))){NEED_RENDER=true;return}
  render();
}

const MODAL={el:null,onDelete:null,onYes:null};
function openModal(html){
  closeModal(true);
  const ov=document.createElement('div');ov.className='ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
  ov.innerHTML='<div class="sheet">'+html+'</div>';
  $('#modal-root').appendChild(ov);MODAL.el=ov;document.documentElement.style.overflow='hidden';
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
  const f=ov.querySelector('input:not([type=checkbox]),select,textarea');
  if(f&&window.matchMedia('(min-width:700px)').matches)f.focus();
}
function closeModal(silent){
  if(MODAL.el){MODAL.el.remove();MODAL.el=null}
  MODAL.onDelete=null;MODAL.onYes=null;document.documentElement.style.overflow='';
  if(!silent&&NEED_RENDER)render();
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function confirmBox(msg,yes,fn){
  openModal(`<div class="mh"><h2>${esc(msg)}</h2></div><div class="mf"><span></span><div class="mfr"><button type="button" class="btn" data-act="close">Cancelar</button><button type="button" class="btn danger" data-act="c-yes">${esc(yes)}</button></div></div>`);

}
function fieldHtml(f,v){
  const id='f_'+f.k,val=v==null?'':v,cls='fld'+(f.full?' full':'');
  if(f.t==='check')return `<label class="fld full chk"><input type="checkbox" id="${id}" name="${f.k}"${v?' checked':''}><span>${esc(f.l)}</span></label>`;
  let ctl;
  if(f.t==='select'){
    const raw=typeof f.opts==='function'?f.opts():f.opts;
    const opts=raw.map(o=>typeof o==='string'?{v:o,l:o}:o);
    if(val!==''&&!opts.some(o=>String(o.v)===String(val)))opts.push({v:val,l:String(val)});
    ctl=`<select id="${id}" name="${f.k}">${f.blank?`<option value="">${typeof f.blank==='string'?esc(f.blank):'—'}</option>`:''}${opts.map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(val)?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
  }else if(f.t==='textarea'){
    ctl=`<textarea id="${id}" name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  }else{
    ctl=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}"${f.t==='number'?' inputmode="decimal" step="any"':''}${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}${f.maxlen?` maxlength="${f.maxlen}"`:''}${f.inputmode?` inputmode="${f.inputmode}"`:''} autocomplete="off">`;
  }
  return `<div class="${cls}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${ctl}</div>`;
}
function openForm(o){
  const values=o.values||{};
  openModal(`<form id="mform" novalidate><div class="mh"><h2>${esc(o.title)}</h2><button type="button" class="x" data-act="close" aria-label="Cerrar">×</button></div>${o.extra||''}<div class="fg">${o.fields.map(f=>fieldHtml(f,values[f.k])).join('')}</div><div class="mf">${o.onDelete?'<button type="button" class="btn danger" data-act="m-del">Eliminar</button>':'<span></span>'}<div class="mfr"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn pri">${esc(o.saveLabel||'Guardar')}</button></div></div></form>`);
  MODAL.onDelete=o.onDelete||null;
  const form=$('#mform');
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const out={};let bad=null;
    for(const f of o.fields){
      const el=form.elements[f.k];if(!el)continue;
      let v;
      if(f.t==='check')v=el.checked;
      else if(f.t==='number')v=el.value===''?null:Number(el.value);
      else v=el.value.trim();
      if(f.req&&(v===''||v==null||(typeof v==='number'&&isNaN(v)))){bad=el;break}
      out[f.k]=v;
    }
    if(bad){bad.classList.add('err');bad.focus();toast('Completa los campos con *');return}
    const r=o.onSave(out);
    if(r!==false)closeModal();
  });
}

const CFG={};
function editItem(key,id,pre){
  const cfg=CFG[key];const L=S[key];const it=id?L.find(x=>x.id===id):null;
  const defaults=Object.assign(cfg.defaults?cfg.defaults():{},pre||{});
  openForm({
    title:(it?'Editar ':'Nuevo ')+cfg.title,fields:cfg.fields(),values:it||defaults,extra:it&&cfg.extra?cfg.extra(it):'',
    onSave:out=>{
      if(cfg.validate){const m=cfg.validate(out);if(m){toast(m);return false}}
      const cur=id?S[key].find(x=>x.id===id):null;let target;
      if(cur){Object.assign(cur,out);delete cur.ej;target=cur}
      else{target=Object.assign({id:uid()},out);S[key].push(target)}
      if(cfg.after)cfg.after(target);
      save(key);render();toast('Guardado');
    },
    onDelete:it?()=>{S[key]=S[key].filter(x=>x.id!==id);if(cfg.onDelete)cfg.onDelete(it);save(key);render();toast('Eliminado')}:null
  });
}

/* ---------- cálculos ---------- */
function occ(from,to){
  const out=[];const f=parse(from),tt=parse(to);
  for(const ev of S.agenda){
    if(!ev.fecha)continue;
    const base=parse(ev.fecha),r=ev.repite||'No';
    if(r==='No'){if(base>=f&&base<=tt)out.push({ev,date:ev.fecha});continue}
    if(base>tt)continue;
    let g=0;
    if(r==='Semanal'){
      let d=base;
      if(d<f){const days=Math.round((f-d)/864e5);d=addDays(d,Math.ceil(days/7)*7)}
      while(d<=tt&&g++<400){out.push({ev,date:iso(d)});d=addDays(d,7)}
    }else{
      const step=r==='Anual'?12:1;let n=0;
      while(g++<800){const s=addMonths(ev.fecha,step*n++);const dd=parse(s);if(dd>tt)break;if(dd>=f)out.push({ev,date:s})}
    }
  }
  out.sort((a,b)=>a.date.localeCompare(b.date)||(a.ev.hora||'').localeCompare(b.ev.hora||''));
  return out;
}
function isDone(t){
  if(!t.hecha)return false;const u=t.ultima;
  if(!u)return t.frec==='Única';
  if(t.frec==='Diaria')return u===TD();
  if(t.frec==='Semanal')return u>=weekStart();
  if(t.frec==='Mensual')return u.slice(0,7)===TD().slice(0,7);
  return true;
}
const mhNext=m=>m.ultimo&&Number(m.cada)?addMonths(m.ultimo,Number(m.cada)):null;
function svStatus(s,v){
  const r={kind:'mute',days:null,kmLeft:null};let k=0;
  if(Number(s.cadaMeses)&&s.ultimaFecha){r.fecha=addMonths(s.ultimaFecha,Number(s.cadaMeses));r.days=daysTo(r.fecha);if(r.days<0)k=2;else if(r.days<=30)k=Math.max(k,1)}
  if(Number(s.cadaKm)&&s.ultimoKm!=null&&v&&v.km!=null){r.kmNext=Number(s.ultimoKm)+Number(s.cadaKm);r.kmLeft=r.kmNext-Number(v.km);if(r.kmLeft<=0)k=2;else if(r.kmLeft<=1000)k=Math.max(k,1)}
  if(r.days!=null||r.kmLeft!=null)r.kind=['ok','warn','bad'][k];
  return r;
}
function svText(st){
  const p=[];
  if(st.kmLeft!=null)p.push(st.kmLeft<=0?'Pasado por '+num(-st.kmLeft)+' km':'Faltan '+num(st.kmLeft)+' km');
  if(st.days!=null)p.push(duePhrase(st.days));
  return p.join(' · ')||'Sin datos para calcular';
}
function ciclo(p){const y=Number(p.cicloAnio)||schoolYear();const ks=[];for(let i=0;i<12;i++){const m=7+i;ks.push((y+Math.floor(m/12))+'-'+pad((m%12)+1))}return ks}
function dueOf(key,dia){const a=key.split('-').map(Number);const last=new Date(a[0],a[1],0).getDate();return key+'-'+pad(Math.min(Number(dia)||10,last))}
function colState(p){
  const start=Number(p.inicioIdx)||0;
  const months=ciclo(p).map((k,i)=>{const paid=p.pagos&&p.pagos[k];const due=dueOf(k,p.diaLimite);return{k,i,paid,due,days:daysTo(due),skip:i<start&&!paid}});
  const live=months.filter(m=>!m.skip);
  const overdue=live.filter(m=>!m.paid&&m.days<0);
  const next=live.find(m=>!m.paid&&m.days>=0)||null;
  const col=Number(p.colegiatura)||0,insc=Number(p.inscripcion)||0;
  const extras=(p.extras||[]).reduce((a,x)=>a+(Number(x.monto)||0),0);
  const total=live.length*col+insc+extras;
  const pagado=months.reduce((a,m)=>a+(m.paid?(Number(m.paid.monto)||0):0),0)+(p.inscPagada?insc:0)+(p.extras||[]).reduce((a,x)=>a+(x.pagado?(Number(x.monto)||0):0),0);
  return{months,overdue,next,total,pagado,pendiente:Math.max(0,total-pagado),paidCount:months.filter(m=>m.paid).length,liveCount:live.length};
}
function alerts(){
  const out=[];const add=(sec,kind,text,sub,days,quien,tab)=>out.push({sec,kind,text,sub,days,quien,tab});
  occ(TD(),iso(addDays(today(),7))).forEach(o=>{const e=o.ev;if((e.repite||'No')==='No'&&e.hecho)return;const d=daysTo(o.date);add('agenda',d<=1?'warn':'info',e.titulo,rel(o.date)+(e.hora?' · '+e.hora:'')+' · '+memberName(e.quien),d)});
  S.tarjetas.forEach(c=>{if(c.tipo!=='Crédito')return;const nd=nextDay(c.diaPago);if(!nd)return;const d=daysTo(nd);if(d<=7&&(Number(c.saldo)||0)>0)add('movimientos',d<=2?'bad':'warn','Pagar '+c.alias,money(c.saldo)+' · '+rel(nd).toLowerCase(),d,c.titular)});
  msiAlerts(add);
  S.manthogar.forEach(m=>{const nx=mhNext(m);if(!nx)return;const d=daysTo(nx);if(d<=14)add('hogar',d<0?'bad':'warn',m.concepto,duePhrase(d),d,m.quien,'manthogar')});
  S.servveh.forEach(s=>{const v=S.vehiculos.find(x=>x.id===s.vehiculoId);if(!v)return;const st=svStatus(s,v);if(st.kind==='bad'||st.kind==='warn')add('hogar',st.kind,v.alias+': '+s.tipo,svText(st),st.days!=null?st.days:(st.kmLeft<=0?-1:15),v.conductor,'vehiculos')});
  S.bienes.forEach(b=>{
    if(b.predialVence){const d=daysTo(b.predialVence);if(d<=30)add('bienes',d<0?'bad':d<=7?'warn':'info','Predial: '+b.nombre,(d<0?'Venció ':'Vence ')+fdate(b.predialVence,fdateY)+(b.predialMonto?' · '+money(b.predialMonto):''),d,undefined)}
    if(b.contratoVence&&b.uso==='En renta'){const d=daysTo(b.contratoVence);if(d<=60)add('bienes',d<0?'bad':d<=30?'warn':'info','Contrato de renta: '+b.nombre,(d<0?'Venció ':'Vence ')+fdate(b.contratoVence,fdateY)+(b.inquilino?' · '+b.inquilino:''),d,undefined)}
  });
  S.medico.forEach(r=>{if(!r.seguimiento)return;const d=daysTo(r.seguimiento);if(d>=0&&d<=30)add('medico',d<=2?'warn':'info','Cita médica: '+(r.motivo||r.tipo),fdate(r.seguimiento,fdateY)+' · '+rel(r.seguimiento)+(r.medico?' · '+r.medico:''),d,r.persona)});
  S.documentos.forEach(x=>{if(!x.vence)return;const d=daysTo(x.vence);if(d<=90)add('documentos',d<0?'bad':d<=30?'warn':'info','Documento: '+x.nombre,(d<0?'Venció ':'Vence ')+fdate(x.vence,fdateY),d,x.quien)});
  S.seguros.forEach(p=>{if(!p.fin)return;const d=daysTo(p.fin);if(d<=60)add('seguros',d<0?'bad':d<=30?'warn':'info',p.tipo+': '+(p.asegurado||p.aseguradora||'póliza'),(d<0?'Venció ':'Vence ')+fdate(p.fin,fdateY),d,p.quien)});
  S.colegiaturas.forEach(p=>{
    const st=colState(p),al=memberName(p.alumno);
    if(st.overdue.length){const n=st.overdue.length;add('movimientos','bad',al+': '+n+(n>1?' colegiaturas vencidas':' colegiatura vencida'),money(n*(Number(p.colegiatura)||0))+' pendiente · '+(p.escuela||''),st.overdue[0].days,p.alumno,'colegiaturas')}
    else if(st.next&&st.next.days<=7)add('movimientos','warn',al+': colegiatura de '+MES[Number(st.next.k.slice(5))-1],money(p.colegiatura)+' · vence '+rel(st.next.due).toLowerCase(),st.next.days,p.alumno,'colegiaturas');
  });
  S.inventario.forEach(a=>{if(!a.garantia||isSalida(a))return;const d=daysTo(a.garantia);if(d>=0&&d<=60)add('hogar','info','Garantía por vencer: '+a.nombre,'Hasta '+fdate(a.garantia,fdateY),d,undefined,'inventario')});
  out.sort((a,b)=>a.days-b.days);
  return out;
}

function tbRange(){
  const t=today(),p=UI.tbPer||'hoy';let a,b;
  if(p==='hoy'){a=b=TD()}
  else if(p==='manana'){a=b=iso(addDays(t,1))}
  else if(p==='semana'){const mon=addDays(t,7-((t.getDay()+6)%7));a=iso(mon);b=iso(addDays(mon,6))}
  else{a=UI.tbDesde||TD();b=UI.tbHasta||a}
  return{d:a,h:b,p};
}
function tfRange(){
  const p=UI.tfPer||'mes';
  if(p==='rango')return{d:UI.tfDesde||'',h:UI.tfHasta||'',p};
  const r=rangeFor(p);return{d:r.d,h:r.h,p};
}

const paretoInfo=(E,total)=>{let cum=0;return E.map(e=>{const antes=cum;cum+=e[1];return{vital:antes/(total||1)<0.8,acum:Math.round(cum/(total||1)*100)}})};
const paretoTag=(x,i,arr)=>x.vital?`<span class="pill">Vital</span>`:'';
const paretoSep=(infos,i,par)=>par&&infos[i]&&infos[i].vital&&(!infos[i+1]||!infos[i+1].vital)&&infos[i+1]?'<div class="s" style="padding:6px 0;text-align:center;border-top:1px dashed var(--surface2)">▲ Hasta aquí se acumula el 80 % del total · el resto es el 20 % restante de categorías pequeñas</div>':'';
function tbCatList(map,total,emptyMsg,par){
  const E=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(!E.length)return `<p class="s">${emptyMsg}</p>`;
  const P=paretoInfo(E,total);
  return E.map((x,i)=>{const pc=x[1]>0&&x[1]/(total||1)<.01?'<1':Math.round(x[1]/(total||1)*100);
    return `<div class="row" style="padding:8px 0"><div class="main"><div class="t">${esc(x[0])}${par&&P[i].vital?' <span class="pill">Vital</span>':''}</div>${par?`<div class="s">Acumulado ${P[i].acum}%</div>`:''}<div class="meter" style="margin-top:5px"><i style="width:${Math.min(100,Math.round(x[1]/(total||1)*100))}%"></i></div></div><span class="tm"><b>${money(x[1])}</b> <span class="s">${pc}%</span></span></div>`+paretoSep(P,i,par)}).join('');
}
function tbIngDet(rows,total,par){
  const G={};rows.forEach(r=>{(G[r.k]=G[r.k]||{t:0,l:[]});G[r.k].t=r2(G[r.k].t+r.v);G[r.k].l.push(r)});
  const E=Object.entries(G).sort((a,b)=>b[1].t-a[1].t);
  if(!E.length)return '<p class="s">Sin ingresos en este periodo.</p>';
  const pc=v=>{const x=v/(total||1)*100;return x>0&&x<1?'<1%':Math.round(x)+'%'};
  const P=paretoInfo(E.map(e=>[e[0],e[1].t]),total);
  return E.map(([k,g],i)=>{
    g.l.sort((a,b)=>b.m.fecha.localeCompare(a.m.fecha));
    const n=g.l.length,prom=r2(g.t/n);
    return `<details class="idet"><summary><div class="row" style="padding:0;border:0"><div class="main"><div class="t"><span class="car" aria-hidden="true">▸</span>${esc(k)}${par&&P[i].vital?' <span class="pill">Vital</span>':''}</div><div class="s">${n} ${n===1?'ingreso':'ingresos'}${n>1?' · promedio '+money(prom):''}${par?' · acumulado '+P[i].acum+'%':''}</div><div class="meter" style="margin-top:5px"><i style="width:${Math.min(100,Math.round(g.t/(total||1)*100))}%"></i></div></div><span class="tm"><b>${money(g.t)}</b> <span class="s">${pc(g.t)}</span></span></div></summary>`+
      g.l.map(({c,m})=>`<div class="imv"><div class="main"><div class="t">${esc(m.concepto||'(sin concepto)')}</div><div class="s">${esc(fdate(m.fecha,{day:'numeric',month:'short',year:'numeric'}))} · ${esc(acct(c))}${m.persona?' · '+esc(m.persona):''}</div></div><b>${money(m.monto)}</b></div>`).join('')+'</details>'+paretoSep(P,i,par);
  }).join('');
}

  return '<div class="chips" style="margin-top:0;margin-bottom:4px" role="tablist" aria-label="Tablero">'+tbChip('tbTab','res','Resumen',T)+tbChip('tbTab','pat','Patrimonio familiar',T)+'</div>'+(T==='pat'?rPatrimonio():rTableroResumen());
}
/* ---------- patrimonio familiar ---------- */
function paRange(){
  const p=UI.paPer||'mes';
  if(p==='rango')return{d:UI.paDesde||'',h:UI.paHasta||'',p};
  if(p==='anio'){const y=today().getFullYear();return{d:y+'-01-01',h:y+'-12-31',p}}
  const r=rangeFor(p);return{d:r.d,h:r.h,p};
}
function balanceData(){
  const pc=b=>{const x=b.propiedad==null||b.propiedad===''?100:Number(b.propiedad);return (isNaN(x)?100:x)/100};
  const deb=S.tarjetas.filter(c=>c.tipo!=='Crédito'),cre=S.tarjetas.filter(c=>c.tipo==='Crédito');
  const inv=S.inventario.filter(a=>!isSalida(a)&&(Number(a.costo)||0)>0);
  const ve=S.vehiculos.filter(v=>(Number(v.valor)||0)>0);
  const bi=S.bienes.filter(b=>(Number(b.valorCom)||0)>0);
  const hi=S.bienes.filter(b=>(Number(b.hipoteca)||0)>0);
  const A=[
    {k:'Efectivo y cuentas de débito',items:deb.map(c=>({n:c.alias,v:Number(c.saldo)||0}))},
    {k:'Bienes raíces (tu parte)',items:bi.map(b=>({n:b.nombre+(pc(b)<1?' ('+Math.round(pc(b)*100)+'%)':''),v:(Number(b.valorCom)||0)*pc(b)}))},
    {k:'Vehículos',items:ve.map(v=>({n:v.alias,v:Number(v.valor)||0}))},
    {k:'Inventario del hogar',items:inv.map(a=>({n:a.nombre,v:Number(a.costo)||0}))}];
  const P=[
    {k:'Tarjetas de crédito',items:cre.map(c=>({n:c.alias,v:Number(c.saldo)||0}))},
    {k:'Créditos hipotecarios (tu parte)',items:hi.map(b=>({n:b.nombre,v:(Number(b.hipoteca)||0)*pc(b)}))}];
  [A,P].forEach(G=>G.forEach(g=>{g.v=r2(g.items.reduce((a,x)=>a+x.v,0));g.items.sort((a,b)=>b.v-a.v)}));
  const ta=r2(A.reduce((a,g)=>a+g.v,0)),tp=r2(P.reduce((a,g)=>a+g.v,0));
  return{A,P,ta,tp,neto:r2(ta-tp)};
}
function paGroup(g,base,col){
  const pct=base>0?Math.round(g.v/base*100):0;
  return `<details class="idet"><summary><div class="row" style="padding:0;border:0"><div class="main"><div class="t"><span class="car" aria-hidden="true">▸</span>${esc(g.k)}</div><div class="s">${g.items.length} ${g.items.length===1?'concepto':'conceptos'}</div><div class="meter" style="margin-top:5px"><i class="${col}" style="width:${Math.min(100,Math.max(0,pct))}%"></i></div></div><span class="tm"><b>${money(g.v)}</b> <span class="s">${pct}%</span></span></div></summary>`+
    (g.items.length?g.items.map(x=>`<div class="imv"><div class="main"><div class="t">${esc(x.n)}</div></div><b>${money(x.v)}</b></div>`).join(''):'<div class="imv"><span class="s">Sin registros todavía.</span></div>')+'</details>';
}
function rPatrimonio(){
  let h=ph('Patrimonio familiar','Estado de posición financiera y flujo de efectivo por categoría');
  if(READONLY)h+='<div class="note">Tienes acceso de solo lectura. Los cambios no se guardan.</div>';
  /* --- estado de posición financiera --- */
  const B=balanceData();
  h+=gl('Estado de posición financiera','a hoy · '+esc(fdate(TD(),fdateY)));
  h+=`<div class="stats">${stat(money(B.ta),'Activos')}${stat(money(B.tp),'Pasivos')}${stat(money(B.neto),'Patrimonio neto')}${stat(B.ta>0?Math.round(B.tp/B.ta*100)+'%':'—','Endeudamiento')}</div>`;
  h+=`<div class="grid" style="margin-top:12px"><article class="card"><div class="t" style="margin-bottom:2px">Activos</div><div class="s" style="margin-bottom:6px">Lo que tienes. Toca un renglón para ver el detalle.</div>${B.A.map(g=>paGroup(g,B.ta,'')).join('')}<div class="row" style="padding:10px 0 0;border-top:1px solid var(--line)"><div class="main"><div class="t">Total de activos</div></div><b>${money(B.ta)}</b></div></article>`+
    `<article class="card"><div class="t" style="margin-bottom:2px">Pasivos</div><div class="s" style="margin-bottom:6px">Lo que debes.</div>${B.P.map(g=>paGroup(g,B.tp,'bad')).join('')}<div class="row" style="padding:10px 0 0;border-top:1px solid var(--line)"><div class="main"><div class="t">Total de pasivos</div></div><b>${money(B.tp)}</b></div>`+
    `<div class="row" style="padding:10px 0 0;margin-top:8px;border-top:2px solid var(--line)"><div class="main"><div class="t">Patrimonio neto</div><div class="s">Activos menos pasivos</div></div><b>${money(B.neto)}</b></div></article></div>`;
  h+='<p class="s" style="margin-top:8px">Saldos de tus cuentas, valor comercial de tus inmuebles (según tu % de propiedad) y valor comercial de tus vehículos y valor o costo registrado del inventario, sin los artículos que ya tuvieron salida.</p>';
  /* --- flujo de efectivo por categoría --- */
  const F=paRange(),cs=UI.paCat||'';
  h+=gl('Flujo de efectivo por categoría');
  h+='<div class="chips" style="margin-top:4px">'+tbChip('paPer','mes','Este mes',F.p)+tbChip('paPer','ant','Mes anterior',F.p)+tbChip('paPer','90','Últimos 90 días',F.p)+tbChip('paPer','anio','Este año',F.p)+tbChip('paPer','rango','Rango de fechas',F.p)+'</div>';
  const cats=new Set(cat('categoriasGasto').concat(['Sin categoría']));allMovs().forEach(({m})=>cats.add(m.categoria||'Sin categoría'));
  h+=`<div class="fg" style="margin-top:4px">${F.p==='rango'?`<div class="fld"><label for="pa-d">Desde</label><input id="pa-d" type="date" value="${esc(F.d)}" data-set="paDesde"></div><div class="fld"><label for="pa-h">Hasta</label><input id="pa-h" type="date" value="${esc(F.h)}" data-set="paHasta"></div>`:''}<div class="fld"><label for="pa-cat">Categoría</label><select id="pa-cat" data-set="paCat">${selOpts([...cats].filter(x=>x!=='Pago de tarjeta'&&x!=='Transferencias').sort((a,b)=>a.localeCompare(b,'es')),cs,'Todas las categorías')}</select></div></div>`;
  if(F.d&&F.h&&F.d>F.h)return h+'<div class="note">La fecha inicial debe ser anterior o igual a la final.</div>';
  const ing={},gas={},meses={},rows=[];let ti=0,tg=0;
  allMovs().forEach(({c,m})=>{
    if((F.d&&m.fecha<F.d)||(F.h&&m.fecha>F.h)||isPagoTc(m))return;
    const k=m.categoria||'Sin categoría';if(cs&&k!==cs)return;
    const g=claseGrp(claseOf(c,m)),v=Number(m.monto)||0;if(g==='transf')return;
    const mk=m.fecha.slice(0,7);(meses[mk]=meses[mk]||{i:0,g:0});
    if(g==='ingreso'){ing[k]=r2((ing[k]||0)+v);ti+=v;meses[mk].i+=v}else{gas[k]=r2((gas[k]||0)+v);tg+=v;meses[mk].g+=v}
    rows.push({c,m,g,v});
  });
  ti=r2(ti);tg=r2(tg);
  h+=`<div class="stats">${stat(money(ti),'Entradas')}${stat(money(tg),'Salidas')}${stat(money(r2(ti-tg)),'Flujo neto')}</div>`;
  if(!rows.length)return h+'<div class="empty" style="margin-top:12px"><p>Sin movimientos en este periodo'+(cs?' para la categoría '+esc(cs):'')+'.</p></div>'+'<p class="s">Las transferencias entre tus cuentas y los pagos de tarjeta no cuentan como entradas ni salidas.</p>';
  h+=`<div class="grid" style="margin-top:12px"><article class="card"><div class="t" style="margin-bottom:6px">Entradas por categoría</div>${tbCatList(ing,ti,'Sin entradas en este periodo.')}</article><article class="card"><div class="t" style="margin-bottom:6px">Salidas por categoría</div>${tbCatList(gas,tg,'Sin salidas en este periodo.')}</article></div>`;
  const ks=Object.keys(meses).sort();
  h+=`<div class="gl" style="margin-top:18px"><span>Flujo por mes</span></div><div class="tbl"><table class="aux" style="min-width:420px"><thead><tr><th>Mes</th><th class="n">Entradas</th><th class="n">Salidas</th><th class="n">Flujo neto</th></tr></thead><tbody>`+ks.map(k=>{const x=meses[k],mm=Number(k.slice(5));return `<tr><td>${esc(cap(MES[mm-1])+' '+k.slice(0,4))}</td><td class="n ab">${money(x.i)}</td><td class="n">${money(x.g)}</td><td class="n"><b>${money(r2(x.i-x.g))}</b></td></tr>`}).join('')+`<tr class="tot"><td>Total</td><td class="n">${money(ti)}</td><td class="n">${money(tg)}</td><td class="n">${money(r2(ti-tg))}</td></tr></tbody></table></div>`;
  if(cs){
    rows.sort((a,b)=>b.m.fecha.localeCompare(a.m.fecha));
    h+=gl('Movimientos de '+esc(cs),rows.length+(rows.length===1?' movimiento':' movimientos'))+'<div class="list">'+rows.slice(0,100).map(x=>`<div class="row" data-act="mv-edit" data-id="${x.c.id}" data-key="${x.m.id}"><div class="main"><div class="t">${esc(x.m.concepto||'(sin concepto)')}</div><div class="s">${esc(fdate(x.m.fecha,fdateY))} · ${esc(acct(x.c))}${x.m.persona?' · '+esc(x.m.persona):''}</div></div><span class="tm"><b>${x.g==='ingreso'?'+':'−'}${money(x.v)}</b></span></div>`).join('')+'</div>'+(rows.length>100?'<p class="s">Se muestran los 100 más recientes.</p>':'');
  }
  h+='<p class="s" style="margin-top:8px">Las transferencias entre tus cuentas y los pagos de tarjeta no cuentan como entradas ni salidas; las compras a meses sin intereses cuentan completas en la fecha de compra.</p>';
  return h;
}
function rTableroResumen(){
  const R=tbRange(),bad=R.d>R.h;
  const label=R.p==='hoy'?cap(fdate(R.d,{weekday:'long',day:'numeric',month:'long'})):R.p==='manana'?cap(fdate(R.d,{weekday:'long',day:'numeric',month:'long'})):fdate(R.d,fdateY)+' al '+fdate(R.h,fdateY);
  let h=ph('Tablero',esc(label));
  if(READONLY)h+='<div class="note">Tienes acceso de solo lectura. Los cambios no se guardan.</div>';
  if(anyEj())h+='<div class="note ej"><span>Estás viendo datos de ejemplo. Quítalos cuando quieras empezar con los tuyos.</span><button class="btn sm" data-act="rm-ej">Quitar ejemplos</button></div>';
  h+='<div class="chips" style="margin-top:4px">'+tbChip('tbPer','hoy','Hoy',R.p)+tbChip('tbPer','manana','Mañana',R.p)+tbChip('tbPer','semana','Próxima semana',R.p)+tbChip('tbPer','rango','Rango de fechas',R.p)+'</div>';
  if(R.p==='rango')h+=`<div class="fg"><div class="fld"><label for="tb-d">Desde</label><input id="tb-d" type="date" value="${esc(R.d)}" data-set="tbDesde"></div><div class="fld"><label for="tb-h">Hasta</label><input id="tb-h" type="date" value="${esc(R.h)}" data-set="tbHasta"></div></div>`;
  if(bad)h+='<div class="note">La fecha inicial debe ser anterior o igual a la final.</div>';
  else{
    const ev=occ(R.d,R.h).filter(o=>(o.ev.repite||'No')!=='No'||!o.ev.hecho).sort((a,b)=>a.date.localeCompare(b.date)||String(a.ev.hora||'').localeCompare(String(b.ev.hora||'')));
    h+=gl('Citas y actividades',ev.length?ev.length+(ev.length===1?' actividad':' actividades'):'');
    if(!ev.length)h+='<div class="empty"><p>Sin citas ni actividades en este periodo.</p></div>';
    else{
      let last='';
      h+='<div class="list">'+ev.map(o=>{
        const e=o.ev,rec=(e.repite||'No')!=='No',hd=(R.d!==R.h&&o.date!==last)?`<div class="gl" style="padding:8px 12px 2px"><span>${esc(cap(fdate(o.date,{weekday:'long',day:'numeric',month:'short'})))}</span></div>`:'';last=o.date;
        return hd+`<div class="row">${rec?'<span class="rep" title="Se repite">↻</span>':`<input type="checkbox" data-act="ag-done" data-id="${e.id}" aria-label="Hecha">`}<div class="main" data-act="edit" data-k="agenda" data-id="${e.id}"><div class="t">${esc(e.titulo)}</div><div class="s">${mDot(e.quien)}${esc(memberName(e.quien))} · ${esc(e.categoria||'')}${e.lugar?' · '+esc(e.lugar):''}</div></div><span class="tm">${esc(e.hora||'Todo el día')}</span></div>`}).join('')+'</div>';
    }
    const lim=daysTo(R.h),AL=alerts().filter(a=>a.sec!=='agenda'&&a.days<=lim);
    const tareas=S.tareas.filter(t=>!isDone(t)),pend=S.super.filter(i=>!i.ok);
    const total=AL.length+tareas.length+(pend.length?1:0);
    h+=gl('Pendientes',total?total+(total===1?' pendiente':' pendientes'):'');
    if(!total)h+='<div class="empty"><h3>Todo al corriente</h3><p>No hay vencimientos ni tareas pendientes.</p></div>';
    else{
      const ids=members().map(m=>m.id).concat(['fam']),G={};
      const key=q=>ids.includes(q)?q:'fam';
      AL.forEach(a=>{(G[key(a.quien)]=G[key(a.quien)]||{al:[],ta:[],su:false}).al.push(a)});
      tareas.forEach(t=>{(G[key(t.quien)]=G[key(t.quien)]||{al:[],ta:[],su:false}).ta.push(t)});
      if(pend.length)(G.fam=G.fam||{al:[],ta:[],su:false}).su=true;
      ids.forEach(id=>{
        const g=G[id];if(!g)return;const n=g.al.length+g.ta.length+(g.su?1:0);
        h+=gl(mDot(id)+esc(id==='fam'?'Toda la familia y general':memberName(id)),n+(n===1?' pendiente':' pendientes'))+'<div class="list">';
        h+=g.al.map(a=>`<div class="row" data-act="go" data-id="${a.tab||(/^Cargo MSI/.test(a.text)?'msi':a.sec)}"><span class="sev ${a.kind}"></span><div class="main"><div class="t">${esc(a.text)}</div><div class="s">${esc(a.sub)}</div></div><span class="pill">${esc(SECS[a.sec].t)}</span></div>`).join('');
        h+=g.ta.map(t=>`<div class="row"><input type="checkbox" data-act="tar-tog" data-id="${t.id}" aria-label="Hecha"><div class="main" data-act="edit" data-k="tareas" data-id="${t.id}"><div class="t">${esc(t.tarea)}</div><div class="s">${esc(t.frec||'')}${t.dia?' · '+esc(t.dia):''}</div></div><span class="pill">Tarea</span></div>`).join('');
        if(g.su)h+=`<div class="row" data-act="go" data-id="super"><div class="main"><div class="t">${pend.length} ${pend.length===1?'producto por comprar':'productos por comprar'}</div><div class="s">Lista del súper</div></div><span class="pill">Súper</span></div>`;
        h+='</div>';
      });
    }
  }
  /* saldos por cuenta */
  h+=gl('Saldos por cuenta');
  if(!S.tarjetas.length)h+='<div class="empty"><p>Registra tus tarjetas en Catálogos para ver sus saldos.</p></div>';
  else{
    const cr=S.tarjetas.filter(c=>c.tipo==='Crédito'),db=S.tarjetas.filter(c=>c.tipo!=='Crédito');
    const tdb=r2(db.reduce((a,c)=>a+(Number(c.saldo)||0),0)),tcr=r2(cr.reduce((a,c)=>a+(Number(c.saldo)||0),0));
    h+=`<div class="stats">${stat(money(tdb),'Disponible en débito')}${stat(money(tcr),'Adeudo en crédito')}${stat(money(r2(tdb-tcr)),'Posición neta')}</div>`;
    h+='<div class="list" style="margin-top:12px">'+S.tarjetas.slice().sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==='Crédito'?1:-1)||a.alias.localeCompare(b.alias,'es')).map(c=>{
      const crd=c.tipo==='Crédito',lim=Number(c.limite)||0;
      return `<div class="row" data-act="tb-cuenta" data-id="${c.id}"><div class="main"><div class="t">${esc(c.alias)}</div><div class="s">${esc([c.banco,c.tipo,c.ult4?'•••• '+c.ult4:''].filter(Boolean).join(' · '))}${crd&&lim?' · disponible '+money(Math.max(0,lim-(Number(c.saldo)||0))):''}</div></div><span class="tm"><b>${money(c.saldo||0)}</b><div class="s" style="text-align:right">${crd?'adeudo':'saldo'}</div></span></div>`}).join('')+'</div>';
  }
  /* ingresos y gastos por categoría */
  const F=tfRange();
  h+=gl('Ingresos y gastos por categoría');
  h+='<div class="chips" style="margin-top:4px">'+tbChip('tfPer','mes','Este mes',F.p)+tbChip('tfPer','ant','Mes anterior',F.p)+tbChip('tfPer','90','Últimos 90 días',F.p)+tbChip('tfPer','rango','Rango de fechas',F.p)+'</div>';
  if(F.p==='rango')h+=`<div class="fg"><div class="fld"><label for="tf-d">Desde</label><input id="tf-d" type="date" value="${esc(F.d)}" data-set="tfDesde"></div><div class="fld"><label for="tf-h">Hasta</label><input id="tf-h" type="date" value="${esc(F.h)}" data-set="tfHasta"></div></div>`;
  if(F.d&&F.h&&F.d>F.h)h+='<div class="note">La fecha inicial debe ser anterior o igual a la final.</div>';
  else{
    const PAR=UI.tfOrd==='pareto',ing={},gas={},ingR=[];let ti=0,tg=0;
    allMovs().forEach(({c,m})=>{
      if((F.d&&m.fecha<F.d)||(F.h&&m.fecha>F.h)||isPagoTc(m))return;
      const g=claseGrp(claseOf(c,m)),v=Number(m.monto)||0,k=m.categoria||'Sin categoría';
      if(g==='ingreso'){ing[k]=r2((ing[k]||0)+v);ti+=v;ingR.push({c,m,k,v})}else if(g==='gasto'){gas[k]=r2((gas[k]||0)+v);tg+=v}
    });
    ti=r2(ti);tg=r2(tg);
    h+=`<div class="chips"><span class="s" style="align-self:center">Orden:</span>${tbChip('tfOrd','monto','Por monto',UI.tfOrd||'monto')}${tbChip('tfOrd','pareto','Pareto (80/20)',UI.tfOrd||'monto')}</div>`;
    if(PAR)h+='<p class="s" style="margin:4px 0">Pareto: de mayor a menor, marca como "Vital" las categorías que juntas suman el 80 % del total; ahí conviene concentrar la atención.</p>';
    h+=`<div class="stats">${stat(money(ti),'Ingresos')}${stat(money(tg),'Gastos')}${stat(money(r2(ti-tg)),'Neto')}</div>`;
    h+=`<article class="card" style="margin-top:12px"><div class="t" style="margin-bottom:2px">Ingresos por categoría</div><div class="s" style="margin-bottom:6px">Toca una categoría para ver cada ingreso.</div>${tbIngDet(ingR,ti,PAR)}</article>`;
    h+=`<article class="card" style="margin-top:12px"><div class="t" style="margin-bottom:6px">Gastos por categoría</div>${tbCatList(gas,tg,'Sin gastos en este periodo.',PAR)}</article>`;
    h+='<p class="s" style="margin-top:8px">Las transferencias entre tus cuentas y los pagos de tarjeta no cuentan como ingresos ni gastos.</p>';
  }
  return h;
}
function metrics(){
  const cr=S.tarjetas.filter(c=>c.tipo==='Crédito');
  const prima=S.seguros.reduce((a,p)=>a+(Number(p.prima)||0),0);
  const pend=S.colegiaturas.reduce((a,p)=>a+colState(p).pendiente,0);
  const mh=S.manthogar.filter(m=>{const n=mhNext(m);return n&&daysTo(n)<=30}).length;
  let sv=0;S.servveh.forEach(s=>{const st=svStatus(s,S.vehiculos.find(v=>v.id===s.vehiculoId));if(st.kind==='bad'||st.kind==='warn')sv++});
  return{
    tablero:occ(TD(),TD()).filter(o=>(o.ev.repite||'No')!=='No'||!o.ev.hecho).length+' actividades hoy',
    agenda:occ(TD(),iso(addDays(today(),7))).length+' en 7 días',
    movimientos:allMovs().filter(x=>x.m.fecha.slice(0,7)===TD().slice(0,7)).length+' movimientos este mes · '+S.tarjetas.length+' cuentas'+(pend>0?' · colegiaturas '+money(pend):'')+(()=>{const v=msiPlans().filter(p=>p.vigente);return v.length?' · '+v.length+(v.length===1?' plan MSI vigente':' planes MSI vigentes'):''})(),
    bienes:S.bienes.length+(S.bienes.length===1?' inmueble':' inmuebles')+(()=>{const v=S.bienes.reduce((a,b)=>a+(Number(b.valorCom)||0),0);return v?' · '+money(v):''})(),
    hogar:S.tareas.filter(t=>!isDone(t)).length+' tareas · '+S.super.filter(i=>!i.ok).length+' por comprar · '+S.recetas.length+' recetas · '+S.inventario.filter(a=>!isSalida(a)).length+' artículos'+((mh+sv)?' · '+(mh+sv)+' mantenimientos por atender':''),
    seguros:S.seguros.length+' pólizas · '+money(prima)+' al año',
    medico:S.medico.length+(S.medico.length===1?' registro':' registros')+(()=>{const n=S.medico.filter(r=>r.seguimiento&&daysTo(r.seguimiento)>=0).length;return n?' · '+n+(n===1?' cita próxima':' citas próximas'):''})(),
    documentos:S.documentos.length+(S.documentos.length===1?' documento':' documentos')+(()=>{const n=S.documentos.filter(x=>x.vence&&daysTo(x.vence)<=90).length;return n?' · '+n+' por vencer':''})(),
    catalogos:members().length+' miembros'};
}

function evRow(o){
  const e=o.ev,rec=(e.repite||'No')!=='No';

function rAgenda(){
  const t0=TD(),m0=parse(UI.agMonth),y=m0.getFullYear(),m=m0.getMonth();
  const startDow=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cells=Math.ceil((startDow+dim)/7)*7;
  const gs=new Date(y,m,1-startDow),ge=new Date(y,m,1-startDow+cells-1);
  const byDay={};occ(iso(gs),iso(ge)).forEach(o=>(byDay[o.date]=byDay[o.date]||[]).push(o));
  let cal='<div class="cal">'+['L','M','M','J','V','S','D'].map(d=>`<div class="dw">${d}</div>`).join('');
  for(let i=0;i<cells;i++){
    const d=new Date(y,m,1-startDow+i),k=iso(d),l=byDay[k]||[];
    cal+=`<button class="d${d.getMonth()!==m?' out':''}${k===t0?' today':''}${UI.agSel===k?' sel':''}" data-act="ag-day" data-id="${k}" aria-label="${esc(fdate(k,{weekday:'long',day:'numeric',month:'long'}))}${l.length?', '+l.length+' actividades':''}">${d.getDate()}<span class="dots">${l.slice(0,3).map(()=>'<i></i>').join('')}</span></button>`;
  }
  cal+='</div>';
  let h=ph('Agenda','Actividades de toda la familia','<button class="btn" data-act="pr-open">Imprimir / PDF</button>'+addBtn('agenda','Actividad',UI.agSel?'fecha='+UI.agSel:''));
  h+=`<div class="calh"><h2>${cap(MES[m])} ${y}</h2><div class="pa"><button class="btn sm" data-act="ag-prev" aria-label="Mes anterior">‹</button><button class="btn sm" data-act="ag-today">Hoy</button><button class="btn sm" data-act="ag-next" aria-label="Mes siguiente">›</button></div></div>`+cal;
  let list,title;
  if(UI.agSel){list=byDay[UI.agSel]||[];title=cap(fdate(UI.agSel,{weekday:'long',day:'numeric',month:'long'}))}
  else{list=occ(t0,iso(addDays(today(),30)));title='Próximos 30 días'}
  h+=gl(esc(title),UI.agSel?'<button class="btn sm" data-act="ag-clear">Ver próximos</button>':'');
  if(!list.length)h+=`<div class="empty"><h3>Sin actividades</h3><p>${UI.agSel?'Este día está libre.':'No hay actividades en los próximos 30 días.'}</p>${addBtn('agenda','Actividad',UI.agSel?'fecha='+UI.agSel:'')}</div>`;
  else if(UI.agSel)h+='<div class="list">'+list.map(evRow).join('')+'</div>';
  else{
    let last='',buf='';
    list.forEach(o=>{if(o.date!==last){if(buf)h+=buf+'</div>';last=o.date;buf=`<div class="gl" style="margin-top:14px"><span>${esc(cap(fdate(o.date,{weekday:'long',day:'numeric',month:'short'})))}</span><span>${esc(rel(o.date))}</span></div><div class="list">`}buf+=evRow(o)});
    if(buf)h+=buf+'</div>';
  }
  return h;
}

      const ep=out?`<span class="pill">${esc(a.motivoSalida||'Salida')}${a.fechaSalida?' · '+esc(fdate(a.fechaSalida,fdateY)):''}</span>`:a.estado==='Para reparar'?'<span class="pill warn">Para reparar</span>':'';

  if(!S.bienes.length)return h+empty('Aún no hay inmuebles','Registra casas, terrenos, locales o ranchos con su escritura, valor, predial y, si aplica, la renta y el crédito.','bienes','Inmueble');
  const tp=UI.biTipo||'',us=UI.biUso||'';
  const L=S.bienes.filter(b=>(!tp||b.tipo===tp)&&(!us||b.uso===us)).sort((a,b)=>(Number(b.valorCom)||0)-(Number(a.valorCom)||0));
  const tot=k=>S.bienes.reduce((a,b)=>a+(Number(b[k])||0),0);
  const part=b=>{const p=b.propiedad==null||b.propiedad===''?100:Number(b.propiedad);return (Number(b.valorCom)||0)*p/100};
  const patr=r2(S.bienes.reduce((a,b)=>a+part(b),0)),hip=tot('hipoteca');
  h+=`<div class="stats">${stat(S.bienes.length,'Inmuebles')}${stat(money(patr),'Valor comercial (tu parte)')}${stat(money(hip),'Créditos hipotecarios')}${stat(money(S.bienes.filter(b=>b.uso==='En renta').reduce((a,b)=>a+(Number(b.renta)||0),0)),'Renta mensual')}</div>`;
  const ct={},cu={};S.bienes.forEach(b=>{ct[b.tipo]=(ct[b.tipo]||0)+1;cu[b.uso]=(cu[b.uso]||0)+1});
  h+='<div class="chips">'+chip('biTipo','','Todos',!tp,S.bienes.length)+Object.keys(ct).sort().map(t=>chip('biTipo',t,t,tp===t,ct[t])).join('')+'</div>';
  if(Object.keys(cu).length>1)h+='<div class="chips" style="margin-top:0">'+chip('biUso','','Cualquier uso',!us)+Object.keys(cu).sort().map(u=>chip('biUso',u,u,us===u,cu[u])).join('')+'</div>';
  if(!L.length)return h+'<div class="empty"><p>No hay inmuebles con estos filtros.</p></div>';
  h+='<div class="grid">'+L.map(b=>{
    const dp=b.predialVence?daysTo(b.predialVence):null,dc=b.uso==='En renta'&&b.contratoVence?daysTo(b.contratoVence):null;
    const sup=[b.terreno?num(b.terreno)+' m² terreno':'',b.construccion?num(b.construccion)+' m² construidos':''].filter(Boolean).join(' · ');
    const eq=(Number(b.valorCom)||0)-(Number(b.hipoteca)||0);
    const kv=[['Dirección',b.direccion],['Propietario',b.titular?b.titular+(b.propiedad!=null&&b.propiedad!==''&&Number(b.propiedad)!==100?' ('+b.propiedad+'%)':''):''],['Superficie',sup],['Clave catastral',b.catastral],['Escritura',b.escritura],
      ['Adquisición',b.fechaAdq||b.valorAdq?[b.fechaAdq?fdate(b.fechaAdq,fdateY):'',b.valorAdq?money(b.valorAdq):''].filter(Boolean).join(' · '):''],
      ['Valor comercial',b.valorCom?money(b.valorCom)+(b.fechaAval?' ('+fdate(b.fechaAval,fdateY)+')':''):''],
      ['Crédito hipotecario',b.hipoteca?money(b.hipoteca)+(b.mensualidad?' · '+money(b.mensualidad)+' al mes':''):''],['Capital neto',b.valorCom&&b.hipoteca?money(eq):''],
      ['Predial',b.predialMonto||b.predialVence?[b.predialMonto?money(b.predialMonto)+' al año':'',b.predialVence?'próximo '+fdate(b.predialVence,fdateY):''].filter(Boolean).join(' · '):''],
      ['Renta',b.renta?money(b.renta)+' al mes'+(b.inquilino?' · '+b.inquilino:''):''],['Contrato',b.contratoVence&&b.uso==='En renta'?'vence '+fdate(b.contratoVence,fdateY):''],['Notas',b.notas]].filter(x=>x[1]);
    return `<article class="card"><div class="tc-h"><div data-act="edit" data-k="bienes" data-id="${b.id}" style="flex:1;min-width:0"><div class="t">${esc(b.nombre)}</div><div class="s">${esc(b.tipo||'')} · ${esc(b.uso||'')}</div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${dp!=null&&dp<=60?`<span class="pill ${dp<0?'bad':dp<=30?'warn':'ok'}">Predial ${esc(dp<0?'vencido':dp===0?'hoy':'en '+dp+' d')}</span>`:''}${dc!=null&&dc<=90?`<span class="pill ${dc<0?'bad':dc<=30?'warn':'ok'}">Contrato ${esc(dc<0?'vencido':'en '+dc+' d')}</span>`:''}</div></div><div data-act="edit" data-k="bienes" data-id="${b.id}"><dl class="kv">${kv.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl></div>${b.predialVence?`<p style="margin-top:10px"><button class="btn sm" data-act="bi-pred" data-id="${b.id}">Registrar predial pagado</button></p>`:''}</article>`;
  }).join('')+'</div>';
  return h;
}
function rSeguros(){

function colCard(p){
  const st=colState(p),al=memberName(p.alumno),pc=st.total?Math.min(100,Math.round(st.pagado/st.total*100)):0;
  const months=st.months.map(m=>{
    const mm=Number(m.k.slice(5));let cls='',sub='';
    if(m.paid){cls='ok';sub='Pagada'}else if(m.skip){cls='skip';sub='—'}else if(m.days<0){cls='bad';sub='Vencida'}else if(m.days<=7){cls='warn';sub=m.days===0?'Hoy':m.days+' d'}else sub=fdate(m.due);
    return `<button class="mo ${cls}" data-act="col-pay" data-id="${p.id}" data-key="${m.k}" aria-label="${esc(cap(MES[mm-1])+': '+sub)}"><b>${MES3[mm-1]}</b><small>${esc(sub)}</small></button>`;
  }).join('');
  const insc=Number(p.inscripcion)||0;
  const ex=(p.extras||[]).map(x=>`<div class="row" style="padding:9px 0"><input type="checkbox" data-act="col-extra-tog" data-id="${p.id}" data-key="${x.id}"${x.pagado?' checked':''} aria-label="Pagado"><div class="main" data-act="col-extra-edit" data-id="${p.id}" data-key="${x.id}"><div class="t${x.pagado?' done':''}">${esc(x.concepto)}</div></div><span class="tm">${money(x.monto)}</span></div>`).join('');
  return `<article class="card"><div class="tc-h"><div data-act="edit" data-k="colegiaturas" data-id="${p.id}" style="flex:1;min-width:0"><div class="t">${mDot(p.alumno)}${esc(al)}</div><div class="s">${esc([p.escuela,p.nivel].filter(Boolean).join(' · '))} · Ciclo ${esc(p.cicloAnio||'')}-${esc(String(Number(p.cicloAnio||0)+1).slice(2))}</div></div><span class="pill ${st.overdue.length?'bad':st.pendiente===0?'ok':''}">${st.overdue.length?st.overdue.length+' vencida'+(st.overdue.length>1?'s':''):st.pendiente===0?'Al corriente':st.paidCount+'/'+st.liveCount}</span></div>
  <div class="meter"><i class="${st.overdue.length?'bad':''}" style="width:${pc}%"></i></div><div class="s2"><span>Pagado <b>${money(st.pagado)}</b></span><span>Pendiente <b>${money(st.pendiente)}</b></span></div>
  <div class="months">${months}</div>
  ${insc?`<div class="row" style="padding:9px 0;margin-top:8px"><input type="checkbox" data-act="col-insc" data-id="${p.id}"${p.inscPagada?' checked':''} aria-label="Inscripción pagada"><div class="main"><div class="t${p.inscPagada?' done':''}">Inscripción</div></div><span class="tm">${money(insc)}</span></div>`:''}${ex}
  <div class="tcf"><button class="btn sm" data-act="col-extra-add" data-id="${p.id}">+ Pago extra</button></div></article>`;
}

function catObjForm(k,id){
  const arr=clone(cat(k)),it=id?arr.find(x=>x.id===id):null,mem=k==='miembros';
  const fields=mem?[{k:'nombre',l:'Nombre',req:1,full:1},{k:'rol',l:'Rol',t:'select',opts:['Padre','Madre','Hijo/a','Otro'],full:1}]:[{k:'nombre',l:'Nombre',req:1,full:1},{k:'oficio',l:'Oficio o servicio'},{k:'tel',l:'Teléfono',inputmode:'tel'}];
  openForm({title:(it?'Editar ':'Nuevo ')+(mem?'miembro':'proveedor'),fields,values:it||(mem?{rol:'Hijo/a'}:{}),
    onSave:o=>{if(it)Object.assign(it,o);else arr.push(Object.assign({id:uid()},o));catSet(k,arr);render()},
    onDelete:it?()=>{catSet(k,arr.filter(x=>x.id!==id));render()}:null});
}

/* ---------- imprimir lista del súper (PDF) ---------- */
const suDate=(i,modo)=>modo==='compra'?(i.compra||i.agregado||TD()):(i.agregado||i.compra||TD());
function suList(o){
  return S.super.filter(i=>{
    if(o.modo==='pend'&&i.ok)return false;
    if(o.modo==='compra'&&!i.ok)return false;
    const d=suDate(i,o.modo);return d>=o.desde&&d<=o.hasta;
  });
}

/* ---------- auxiliar de tarjetas ---------- */
const movs=id=>S['mov_'+id]||[];
const effOf=(c,m)=>(c.tipo==='Crédito'?1:-1)*(m.tipo==='cargo'?1:-1)*(Number(m.monto)||0);
const auMatch=(m,f)=>(!f.cat||m.categoria===f.cat)&&(!f.area||m.area===f.area)&&(!f.persona||String(m.persona||'').toLowerCase().includes(f.persona.toLowerCase()));
function auxData(c,desde,hasta,f){
  const all=movs(c.id).map((m,i)=>({m,i})).sort((a,b)=>String(a.m.fecha).localeCompare(String(b.m.fecha))||a.i-b.i);
  let bal=(Number(c.saldo)||0)-all.reduce((a,x)=>a+effOf(c,x.m),0);
  all.filter(x=>x.m.fecha<desde).forEach(x=>{bal+=effOf(c,x.m)});
  const ini=r2(bal),inr=all.filter(x=>x.m.fecha>=desde&&x.m.fecha<=hasta);
  const rows0=inr.map(x=>{bal+=effOf(c,x.m);return{m:x.m,saldo:r2(bal)}});
  const rows=f?rows0.filter(r=>auMatch(r.m,f)):rows0;
  const sum=t=>r2(rows.filter(x=>x.m.tipo===t).reduce((a,x)=>a+(Number(x.m.monto)||0),0));
  return{ini,rows,cargos:sum('cargo'),abonos:sum('abono'),fin:r2(bal)};
}
function catTotals(A){
  const t={};A.rows.forEach(r=>{if(r.m.tipo!=='cargo'||(r.m.clase&&r.m.clase!=='gasto'))return;const k=r.m.categoria||'Sin categoría';t[k]=r2((t[k]||0)+(Number(r.m.monto)||0))});
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}
const CLASES={gasto:'Gasto',deposito:'Depósito',ingreso:'Ingreso',transf_out:'Transferencia enviada',transf_in:'Transferencia recibida'};
const claseOf=(c,m)=>m.clase||(m.tipo==='cargo'?'gasto':(c.tipo==='Crédito'?'ingreso':'deposito'));
const tipoOfClase=k=>(k==='gasto'||k==='transf_out')?'cargo':'abono';
const isTransf=k=>k==='transf_out'||k==='transf_in';
const claseTxt=(c,m)=>{const k=claseOf(c,m);let t=CLASES[k]||'';if(m.msi)t+=' · '+m.msi+' MSI';if(isTransf(k)&&m.contra){const o=byId('tarjetas',m.contra);t+=(k==='transf_out'?' a ':' de ')+(o?o.alias:'otra tarjeta')}return t};
function mirrorRemove(m){
  if(!m||!m.par||!m.contra)return;
  const c2=byId('tarjetas',m.contra),k2='mov_'+m.contra;ensureMov(m.contra);
  const x=S[k2].find(z=>z.id===m.par);
  if(x){if(c2)c2.saldo=r2((Number(c2.saldo)||0)-effOf(c2,x));S[k2]=S[k2].filter(z=>z.id!==m.par);save(k2);if(c2)save('tarjetas')}
}
function mirrorAdd(card,m){
  const c2=byId('tarjetas',m.contra);if(!c2)return;
  const k2='mov_'+c2.id;ensureMov(c2.id);
  const kk=m.clase==='transf_out'?'transf_in':'transf_out';
  const x={id:uid(),fecha:m.fecha,concepto:m.concepto,clase:kk,tipo:tipoOfClase(kk),contra:card.id,par:m.id,monto:m.monto,area:m.area,metodo:m.metodo};
  S[k2].push(x);c2.saldo=r2((Number(c2.saldo)||0)+effOf(c2,x));m.par=x.id;save(k2);save('tarjetas');
}

/* --- meses sin intereses (MSI) --- */
const MSI_PLAZOS=[3,6,12,18,24];
function corteOn(y,mo,dia){const dim=new Date(y,mo+1,0).getDate();return iso(new Date(y,mo,Math.min(dia,dim)))}
function msiSched(c,m){
  const n=Number(m.msi)||0;if(!n)return[];
  const dia=Number(c.diaCorte)||0,p=parse(m.fecha);
  const total=Number(m.monto)||0,base=Math.floor(total/n*100)/100,out=[];
  let y=p.getFullYear(),mo=p.getMonth();
  if(dia&&corteOn(y,mo,dia)<=m.fecha)mo++;
  for(let i=0;i<n;i++){
    const date=dia?corteOn(y,mo+i,dia):addMonths(m.fecha,1+i);
    out.push({n:i+1,date,monto:i===n-1?r2(total-base*(n-1)):r2(base)});
  }
  return out;
}
function msiPlans(){
  return allMovs().filter(({c,m})=>(Number(m.msi)||0)>0&&c.tipo==='Crédito'&&claseOf(c,m)==='gasto').map(({c,m})=>{
    const sc=msiSched(c,m),t=TD(),apl=sc.filter(x=>x.date<=t),pend=sc.filter(x=>x.date>t);
    return{c,m,sc,apl:apl.length,pend,restante:r2(pend.reduce((a,x)=>a+x.monto,0)),next:pend[0]||null,mens:sc[0]?sc[0].monto:0,vigente:pend.length>0};
  }).sort((a,b)=>(b.vigente-a.vigente)||String((a.next||{}).date||'9').localeCompare(String((b.next||{}).date||'9')));
}
function msiAlerts(add){
  const by={};
  msiPlans().forEach(pl=>{if(!pl.next)return;const d=daysTo(pl.next.date);if(d>30)return;const k=pl.c.id+'|'+pl.next.date;(by[k]=by[k]||{c:pl.c,date:pl.next.date,v:0,n:0}).v+=pl.next.monto;by[k].n++});
  Object.values(by).forEach(x=>{const d=daysTo(x.date);add('movimientos',d<=2?'warn':'info','Cargo MSI en '+x.c.alias,money(r2(x.v))+' · '+x.n+(x.n===1?' compra':' compras')+' a meses sin intereses · '+rel(x.date).toLowerCase(),d,x.c.titular)});
}

function rMsi(){
  const ver=UI.msiVer||'vig',all=msiPlans(),vig=all.filter(p=>p.vigente);
  let h=ph('Meses sin intereses','Compras a plazos con tus tarjetas de crédito y los cargos que hará el banco cada mes','<button class="btn pri" data-act="msi-new">+ Compra a MSI</button>');
  if(!S.tarjetas.some(c=>c.tipo==='Crédito'))return h+empty('Aún no tienes tarjetas de crédito','Registra una en Catálogos, en "Tarjetas y cuentas".');
  if(!all.length)return h+empty('Sin compras a MSI','Al registrar un egreso en una tarjeta de crédito, elige el plazo en "Meses sin intereses" y aparecerá aquí con su calendario de cargos.');
  const mensTot=r2(vig.reduce((a,p)=>a+(p.next?p.next.monto:0),0)),resTot=r2(vig.reduce((a,p)=>a+p.restante,0));
  const nxt=vig.map(p=>p.next).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const nxtTot=nxt?r2(vig.filter(p=>p.next&&p.next.date===nxt.date).reduce((a,p)=>a+p.next.monto,0)):0;
  h+=`<div class="stats">${stat(String(vig.length),'Planes vigentes')}${stat(money(mensTot),'Cargo mensual')}${stat(money(resTot),'Por cargar (total)')}${stat(nxt?money(nxtTot):'—',nxt?'Próximo cargo · '+fdate(nxt.date):'Próximo cargo')}</div>`;
  /* próximos meses */
  const mes={};
  vig.forEach(p=>p.pend.forEach(x=>{const k=x.date.slice(0,7);const o=mes[k]=mes[k]||{v:0,por:{}};o.v=r2(o.v+x.monto);o.por[p.c.alias]=r2((o.por[p.c.alias]||0)+x.monto)}));
  const K=Object.keys(mes).sort().slice(0,6);
  if(K.length)h+=gl('Cargos de los próximos meses')+'<div class="list">'+K.map(k=>`<div class="row"><div class="main"><div class="t">${esc(cap(MES[Number(k.slice(5))-1])+' '+k.slice(0,4))}</div><div class="s">${esc(Object.entries(mes[k].por).map(e=>e[0]+' '+money(e[1])).join(' · '))}</div></div><span class="tm"><b>${money(mes[k].v)}</b></span></div>`).join('')+'</div>';

  const L=ver==='vig'?vig:ver==='liq'?all.filter(p=>!p.vigente):all;
  if(!L.length)return h+'<div class="empty"><p>No hay planes en esta vista.</p></div>';
  h+='<div class="list">'+L.map(p=>{
    const n=Number(p.m.msi),pc=Math.round(p.apl/n*100);
    return `<div class="row" data-act="msi-open" data-id="${p.c.id}" data-key="${p.m.id}"><div class="main"><div class="t">${esc(p.m.concepto)}</div><div class="s">${esc(acct(p.c))} · ${p.apl} de ${n} cargos · ${money(p.mens)} al mes${p.next?' · próximo '+esc(fdate(p.next.date)):' · liquidado'}</div><div class="meter" style="margin-top:6px"><i style="width:${pc}%"></i></div></div><span class="tm"><b>${money(p.m.monto)}</b><div class="s" style="text-align:right">${p.vigente?'resta '+money(p.restante):'pagado'}</div></span></div>`}).join('')+'</div>';
  return h;
}

/* --- conciliación --- */
function cnData(){
  const c=byId('tarjetas',UI.cnCuenta);if(!c)return null;
  const corte=UI.cnCorte||TD(),libros=auxData(c,'0000-01-01',corte).fin;
  const L=movs(c.id).filter(m=>m.fecha<=corte).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const pend=L.filter(m=>!m.conc),efp=r2(pend.reduce((a,m)=>a+effOf(c,m),0)),concl=r2(libros-efp);
  const has=UI.cnSaldo!==undefined&&UI.cnSaldo!==''&&!isNaN(Number(UI.cnSaldo)),est=has?Number(UI.cnSaldo):null;
  return{c,corte,libros,L,pend,efp,concl,has,est,dif:has?r2(est-concl):null};
}

    h+=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="cn-marcar" data-val="1">Marcar todos</button><button class="btn sm" data-act="cn-marcar" data-val="0">Quitar marcas</button><button class="btn sm pri" data-act="cn-save"${D.has?'':' disabled'}>Guardar conciliación</button></div></article>`;

    h+='<div class="tbl"><table class="aux"><thead><tr><th style="width:34px" title="Conciliado">✓</th><th>Fecha</th><th>Concepto</th><th class="n">Cargos</th><th class="n">Abonos</th><th></th></tr></thead><tbody>';

  return h+'</article>';
}

/* ---------- imprimir agenda (PDF) ---------- */
function agList(o){
  return occ(o.desde,o.hasta).filter(x=>{
    const e=x.ev;
    if(o.quien&&e.quien!==o.quien&&!(o.fam&&e.quien==='fam'))return false;
    if(o.cat&&e.categoria!==o.cat)return false;
    if(!o.hechas&&(e.repite||'No')==='No'&&e.hecho)return false;
    return true;
  });
}
function prRead(){
  const g=id=>document.getElementById(id);
  return{desde:g('p-desde').value,hasta:g('p-hasta').value,quien:g('p-quien').value,cat:g('p-cat').value,fam:g('p-fam').checked,hechas:g('p-hechas').checked,vista:g('p-vista').value};
}
function prUpdate(){
  const n=$('#p-n'),b=$('#p-go');if(!n||!b)return;
  const o=prRead();let msg,ok=false;
  if(!o.desde||!o.hasta)msg='Elige las dos fechas.';
  else if(o.desde>o.hasta)msg='La fecha inicial debe ser anterior a la final.';
  else if(o.vista!=='lista'&&Math.round((parse(o.hasta)-parse(o.desde))/864e5)>400)msg='Para el calendario el rango máximo es de 13 meses.';
  else if(Math.round((parse(o.hasta)-parse(o.desde))/864e5)>366)msg='El rango máximo es de un año.';
  else{const c=agList(o).length;ok=c>0;msg=c?c+(c===1?' actividad en el rango':' actividades en el rango'):'No hay actividades con estos filtros.'}
  n.textContent=msg;b.disabled=!ok;
}

function agPdf(o,list){
  const modo=o.vista||'ambos';
  const doc=new window.jspdf.jsPDF({unit:'pt',format:'letter',orientation:modo==='lista'?'portrait':'landscape'});
  const PW=612,PH=792,M=44,W=PW-2*M,BOT=PH-M-16;
  const INK=[22,48,43],MUT=[90,107,102],BAND=[233,239,236],LINE=[212,221,217],ACC=[229,138,31];
  const cl=s=>String(s==null?'':s).replace(/[^\x20-\xff]/g,'');
  const qn=o.quien?memberName(o.quien)+(o.fam&&o.quien!=='fam'?' (y toda la familia)':''):'Todos';
  const hsl=(h,sa,l)=>{const a=sa*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]};
  const pdfColor=id=>{const i=members().findIndex(m=>m.id===id);return id==='fam'||i<0?MUT:hsl((i*67+20)%360,.55,.48)};
  if(modo!=='lista'){
    const LW=792,LH=612,LM=36,GW=LW-2*LM,cw=GW/7;
    const by={};list.forEach(x=>{(by[x.date]=by[x.date]||[]).push(x)});
    Object.values(by).forEach(a=>a.sort((p,q)=>String(p.ev.hora||'').localeCompare(String(q.ev.hora||''))));
    let cy=parse(o.desde).getFullYear(),cm=parse(o.desde).getMonth();
    const ey=parse(o.hasta).getFullYear(),em=parse(o.hasta).getMonth();
    let first=true;
    while(cy<ey||(cy===ey&&cm<=em)){
      if(!first)doc.addPage('letter','landscape');first=false;
      const dim=new Date(cy,cm+1,0).getDate(),sdow=(new Date(cy,cm,1).getDay()+6)%7,rows=Math.ceil((sdow+dim)/7);
      doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(...INK);doc.text(cl(cap(MES[cm])+' '+cy),LM,LM+16);
      doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...MUT);
      doc.text(cl('Quién: '+qn+'   ·   Categoría: '+(o.cat||'Todas')),LW-LM,LM+14,{align:'right'});
      let gy=LM+34;
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...MUT);
      ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'].forEach((d,i)=>doc.text(d,LM+i*cw+cw/2,gy+8,{align:'center'}));
      gy+=14;const ch=(LH-44-gy)/rows,pad=2;
      for(let c=0;c<rows*7;c++){
        const day=c-sdow+1,col=c%7,row=Math.floor(c/7),x=LM+col*cw+pad/2,y0=gy+row*ch+pad/2,w=cw-pad,h=ch-pad;
        const inM=day>=1&&day<=dim;
        const ds=inM?cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'):'';
        doc.setLineWidth(.6);
        if(!inM){doc.setFillColor(244,246,245);doc.rect(x,y0,w,h,'F');continue}
        const isT=ds===TD();
        doc.setFillColor(255,255,255);doc.setDrawColor(...(isT?ACC:LINE));doc.setLineWidth(isT?1.6:.6);doc.roundedRect(x,y0,w,h,3,3,'FD');
        doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...(isT?ACC:INK));doc.text(String(day),x+5,y0+12);
        const L=by[ds]||[],maxL=Math.max(1,Math.floor((h-18)/9));
        const show=L.length>maxL?L.slice(0,maxL-1):L;
        doc.setFontSize(7);let ty=y0+22;
        show.forEach(it=>{
          const e=it.ev;doc.setFillColor(...pdfColor(e.quien));doc.circle(x+7,ty-2,1.9,'F');
          doc.setFont('helvetica',e.hecho&&(e.repite||'No')==='No'?'normal':'bold');doc.setTextColor(...INK);
          let t=cl((e.hora?e.hora+' ':'')+e.titulo);
          while(t.length>1&&doc.getTextWidth(t)>w-18)t=t.slice(0,-1);
          if(t.length<cl((e.hora?e.hora+' ':'')+e.titulo).length)t=t.slice(0,-1)+'...';
          doc.text(t,x+12,ty);ty+=9;
        });
        if(L.length>show.length){doc.setFont('helvetica','normal');doc.setTextColor(...MUT);doc.text('+ '+(L.length-show.length)+' más',x+12,ty)}
      }
      cm++;if(cm>11){cm=0;cy++}
    }
  }
  let y=M;
  if(modo!=='cal'){
  if(modo==='ambos')doc.addPage('letter','portrait');
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.setTextColor(...INK);doc.text('Agenda del hogar',M,y+14);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(...MUT);
  doc.text(cl(fdate(o.desde,fdateY)+' al '+fdate(o.hasta,fdateY)),M,y+32);
  doc.text(cl('Quién: '+qn+'   ·   Categoría: '+(o.cat||'Todas')+'   ·   '+list.length+(list.length===1?' actividad':' actividades')),M,y+46);
  y+=58;doc.setDrawColor(...INK);doc.setLineWidth(1.2);doc.line(M,y,M+W,y);y+=14;
  const dayHead=d=>{
    doc.setFillColor(...BAND);doc.rect(M,y,W,20,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...INK);
    doc.text(cl(cap(fdate(d,{weekday:'long',day:'numeric',month:'long'}))),M+8,y+14);y+=26;
  };
  let last='';
  list.forEach(x=>{
    const e=x.ev,rec=(e.repite||'No')!=='No';
    doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setLineHeightFactor(1.25);
    const tl=doc.splitTextToSize(cl(e.titulo),230);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setLineHeightFactor(1.35);
    const ml=doc.splitTextToSize(cl([memberName(e.quien),e.categoria,e.lugar].filter(Boolean).join(' · ')),W-340);
    const h=Math.max(tl.length,ml.length)*13+8;
    if(x.date!==last){if(y+26+h>BOT){doc.addPage('letter','portrait');y=M}dayHead(x.date);last=x.date}
    else if(y+h>BOT){doc.addPage('letter','portrait');y=M;dayHead(x.date)}
    doc.setDrawColor(...MUT);doc.setLineWidth(.8);doc.setTextColor(...MUT);
    if(!rec){doc.rect(M+6,y+3,9,9);if(e.hecho){doc.line(M+8,y+8,M+10.5,y+11);doc.line(M+10.5,y+11,M+13.5,y+5)}}
    else{doc.setFontSize(8);doc.text('rep.',M+5,y+11)}
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...INK);doc.text(cl(e.hora||'Todo el día'),M+24,y+11);
    doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setLineHeightFactor(1.25);doc.text(tl,M+90,y+11);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setLineHeightFactor(1.35);doc.setTextColor(...MUT);doc.text(ml,M+340,y+11);
    doc.setDrawColor(...LINE);doc.setLineWidth(.5);doc.line(M,y+h-2,M+W,y+h-2);y+=h;
  });
  }
  const N=doc.getNumberOfPages();
  for(let i=1;i<=N;i++){
    doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MUT);
    const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight(),fm=pw>ph?36:M;
    doc.text('Hogar 360',fm,ph-32);
    doc.text(cl('Generado el '+fdate(TD(),fdateY)+' · Página '+i+' de '+N),pw-fm,ph-32,{align:'right'});
  }
  return doc.output('arraybuffer');
}

 'veh-km':el=>{const v=byId('vehiculos',el.dataset.id);if(!v)return;openForm({title:'Kilometraje de '+v.alias,fields:[{k:'km',l:'Kilometraje actual',t:'number',req:1,min:0,full:1}],values:{km:v.km},onSave:o=>{const x=byId('vehiculos',v.id);if(!x)return;x.km=o.km;delete x.ej;save('vehiculos');render();toast('Kilometraje actualizado')}})},
 'sv-reg':el=>{const s=byId('servveh',el.dataset.id);if(!s)return;const v=byId('vehiculos',s.vehiculoId);regForm('Registrar: '+s.tipo,true,v?v.km:null,o=>{
   const x=byId('servveh',s.id);if(!x)return;x.hist=x.hist||[];x.hist.unshift({id:uid(),fecha:o.fecha,km:o.km,costo:o.costo,prov:o.prov,nota:o.nota});
   if(!x.ultimaFecha||o.fecha>=x.ultimaFecha){x.ultimaFecha=o.fecha;if(o.km!=null)x.ultimoKm=o.km}
   const vv=byId('vehiculos',x.vehiculoId);if(vv&&o.km!=null&&(vv.km==null||o.km>vv.km)){vv.km=o.km;save('vehiculos')}
   delete x.ej;save('servveh');render();toast('Servicio registrado')})},
 /* colegiaturas */
 'col-pay':el=>{
  const p=byId('colegiaturas',el.dataset.id),k=el.dataset.key;if(!p)return;const cur=p.pagos&&p.pagos[k];
  openForm({title:'Pago de '+MES[Number(k.slice(5))-1]+' '+k.slice(0,4),fields:[{k:'fecha',l:'Fecha de pago',t:'date',req:1},{k:'monto',l:'Monto pagado',t:'number',req:1,min:0}],values:cur||{fecha:TD(),monto:p.colegiatura},saveLabel:'Marcar pagada',
   onSave:o=>{const x=byId('colegiaturas',p.id);if(!x)return;x.pagos=x.pagos||{};x.pagos[k]={fecha:o.fecha,monto:o.monto};delete x.ej;save('colegiaturas');render();toast('Pago registrado')},
   onDelete:cur?()=>{const x=byId('colegiaturas',p.id);if(x&&x.pagos){delete x.pagos[k];save('colegiaturas');render()}}:null});
 },
 'col-insc':el=>{const p=byId('colegiaturas',el.dataset.id);if(p){p.inscPagada=!p.inscPagada;save('colegiaturas');render()}},
 'col-extra-tog':el=>{const p=byId('colegiaturas',el.dataset.id);const x=p&&(p.extras||[]).find(e=>e.id===el.dataset.key);if(x){x.pagado=!x.pagado;save('colegiaturas');render()}},
 'col-extra-add':el=>colExtra(el.dataset.id,null),
 'col-extra-edit':el=>colExtra(el.dataset.id,el.dataset.key),
 /* catálogos */
 'cat-edit':el=>catObjForm(el.dataset.k,el.dataset.id),
 'cat-del':el=>{const arr=clone(cat(el.dataset.k)),i=Number(el.dataset.i),n=arr[i];arr.splice(i,1);catSet(el.dataset.k,arr);render();toast('Quitado: '+n)}
};
function colExtra(pid,eid){
  const p=byId('colegiaturas',pid);if(!p)return;const it=eid?(p.extras||[]).find(e=>e.id===eid):null;
  openForm({title:it?'Editar pago extra':'Pago extra',fields:[{k:'concepto',l:'Concepto',req:1,full:1,ph:'Uniformes, útiles, excursión'},{k:'monto',l:'Monto',t:'number',req:1,min:0},{k:'pagado',l:'Ya está pagado',t:'check'}],values:it||{},
   onSave:o=>{const x=byId('colegiaturas',pid);if(!x)return;x.extras=x.extras||[];const cur=eid?x.extras.find(e=>e.id===eid):null;if(cur)Object.assign(cur,o);else x.extras.push(Object.assign({id:uid()},o));delete x.ej;save('colegiaturas');render();toast('Guardado')},
   onDelete:it?()=>{const x=byId('colegiaturas',pid);if(x){x.extras=x.extras.filter(e=>e.id!==eid);save('colegiaturas');render()}}:null});
}
const FORMS={
 'sup-add':f=>{
  const n=f.elements.n.value.trim();if(!n)return;
  const k=f.elements.k.value;UI.supCat=k;
  S.super.push({id:uid(),nombre:n,cant:f.elements.c.value.trim(),unidad:f.elements.u.value,cat:k,agregado:TD()});save('super');UI.focus='sup-n';render();
 },
 'cat-add':f=>{
  const k=f.dataset.k,n=f.elements.n.value.trim();if(!n)return;
  const arr=clone(cat(k));if(arr.some(x=>String(x).toLowerCase()===n.toLowerCase())){toast('Ya existe en la lista');return}
  arr.push(n);catSet(k,arr);render();toast('Agregado: '+n);
 }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn)fn(el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.set){UI[t.dataset.set]=t.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL.el)closeModal()});

{const bl=document.getElementById('brandlogo');if(bl){bl.src=LOGO;bl.alt=LOGO_ALT}}
render();
initDb();
